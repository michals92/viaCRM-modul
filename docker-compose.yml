
services:
  espocrm:
    image: espocrm/espocrm:latest
    container_name: espocrm_app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - ESPOCRM_DATABASE_HOST=mysql
      - ESPOCRM_DATABASE_NAME=espocrm
      - ESPOCRM_DATABASE_USER=espocrm
      - ESPOCRM_DATABASE_PASSWORD=espocrm_password
      - ESPOCRM_ADMIN_USERNAME=admin
      - ESPOCRM_ADMIN_PASSWORD=admin
      - ESPOCRM_SITE_URL=http://localhost:8090
    volumes:
      - espocrm_data:/var/www/html
      - ./custom:/var/www/html/custom
      - ./logs:/var/www/html/logs
    depends_on:
      - mysql
    networks:
      - espocrm_network

  mysql:
    image: mysql:8.0
    container_name: espocrm_mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=espocrm
      - MYSQL_USER=espocrm
      - MYSQL_PASSWORD=espocrm_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "33061:3306"
    networks:
      - espocrm_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: espocrm_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_USER=espocrm
      - PMA_PASSWORD=espocrm_password
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - espocrm_network

volumes:
  espocrm_data:
    driver: local
  mysql_data:
    driver: local

networks:
  espocrm_network:
    driver: bridge